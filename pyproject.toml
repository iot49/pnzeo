[project]
name = "pnzeo"
version = "0.1.0"
description = "Take pictures and movies from a Pnzeo W3 IP camera over HTTP"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bernhard Boser" }]
dependencies = []

[project.optional-dependencies]
gray = ["pillow"]
mp4 = ["imageio-ffmpeg"]

[project.scripts]
pnzeo = "pnzeo_cam:main"

[project.urls]
Homepage = "https://github.com/iot49/pnzeo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["pnzeo_cam.py"]

[dependency-groups]
dev = ["pytest"]
